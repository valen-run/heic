[workspace]
resolver = "2"
members = [
    "crates/*",
    "wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Valen Engineering <hi@valen.run>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/valen-run/heic"
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0.20"
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
web-sys = "0.3.104"

# Internal workspace crates
valen-heic-core = { path = "crates/heic-core", version = "0.1.0" }
valen-heif-parser = { path = "crates/heif-parser", version = "0.1.0" }
valen-heic-decoder = { path = "crates/heic-decoder", version = "0.1.0" }
valen-image-processing = { path = "crates/image-processing", version = "0.1.0" }
valen-image-encoder = { path = "crates/image-encoder", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
strip = true
