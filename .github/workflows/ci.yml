name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Check WASM target compilation
        run: cargo check --package valen-heic-wasm --target wasm32-unknown-unknown

  wasm-build:
    name: WASM Build & Size Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build WebAssembly Module
        run: bash scripts/build-wasm.sh

      - name: Verify WASM Size Budget
        run: bash scripts/check-size.sh

      - name: Upload WASM Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: packages/heic/pkg/
          if-no-files-found: error

  browser-tests:
    name: Playwright Cross-Browser Tests
    runs-on: ubuntu-latest
    needs: [wasm-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: packages/heic/pkg/

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript Package
        run: pnpm run build:js

      - name: Install Playwright Browsers
        run: npx --yes playwright install --with-deps chromium firefox webkit

      - name: Run Playwright Test Suite
        run: npx playwright test -c tests/browser/playwright.config.ts

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Run pnpm audit
        run: pnpm audit --prod
